[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumintelligence-engine"
version = "0.1.2"
description = "LumIntelligence: a personal knowledge base from your files, with cited answers, for Hermes and the command line."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "LumIntelligence, Inc." }]
keywords = ["knowledge-graph", "rag", "hermes", "local-llm", "knowledge-base"]
classifiers = ["License :: Other/Proprietary License", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "sqlite-vec>=0.1",
]

[project.urls]
Homepage = "https://www.lumintelligence.com"
Repository = "https://github.com/LumIntelligence/LumIntelligence-hermes-skills"

[project.scripts]
lum = "lumintelligence.cli:main"

[project.optional-dependencies]
# OpenAI and any OpenAI-compatible local runtime (base_url).
openai = ["openai>=1.0"]
# Consolidator.rebuild() (global re-clustering) only; imported lazily.
cluster = ["scikit-learn>=1.3"]
# File input layer: PDF and DOCX parsing. TXT/MD/JSON need nothing extra.
files = ["pdfplumber>=0.11", "python-docx>=1.1"]
# Only needed if the Python's sqlite3 cannot load extensions.
sqlite-ext = ["pysqlite3>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.16", "pyright>=1.1", "scikit-learn>=1.3", "pdfplumber>=0.11", "python-docx>=1.1", "reportlab>=4.0"]

[tool.setuptools.packages.find]
include = ["lumintelligence*"]

[tool.setuptools.package-data]
"lumintelligence.prompts" = ["*.txt"]
"lumintelligence.nod.prompts" = ["*.txt"]
"lumintelligence.adhd.prompts" = ["*.txt"]
"lumintelligence" = ["skill/*.md", "skill/scripts/*", "skill/references/*", "skill/examples/custom_prompts/*/*"]

# Lint and type-check settings.
[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", "build", "dist"]

[tool.pyright]
include = ["lumintelligence"]
pythonVersion = "3.11"
